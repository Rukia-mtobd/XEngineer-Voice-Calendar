<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音日历工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(160deg, #f0f4f8 0%, #e8edf2 100%);
            color: #2c3e50;
            font-size: 14px;
            line-height: 1.5;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 24px 32px;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a2b3c;
            letter-spacing: 0.5px;
        }

        .header p {
            margin-top: 4px;
            font-size: 12px;
            color: #8899a6;
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 720px;
            flex: 1;
            min-height: 0;
        }

        .card {
            background: #ffffff;
            border: 1px solid #dde3ea;
            border-radius: 10px;
            padding: 16px 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #4a5f73;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eef2f6;
        }

        /* 配置区域 */
        .config-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .config-row label {
            flex-shrink: 0;
            font-size: 13px;
            color: #5a6d7e;
            white-space: nowrap;
        }

        .config-row input {
            flex: 1;
            height: 36px;
            padding: 0 12px;
            border: 1px solid #cdd6df;
            border-radius: 6px;
            font-size: 13px;
            color: #2c3e50;
            background: #fafbfc;
            outline: none;
        }

        .config-row input::placeholder {
            color: #aab8c4;
        }

        .btn {
            flex-shrink: 0;
            height: 36px;
            padding: 0 18px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: default;
            white-space: nowrap;
        }

        .btn-primary {
            background: #3b82f6;
            color: #ffffff;
        }

        /* 语音操作区域 */
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 12px;
        }

        .btn-voice {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            background: linear-gradient(145deg, #eff6ff 0%, #dbeafe 100%);
            color: #2563eb;
            font-size: 15px;
            font-weight: 600;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .voice-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #8899a6;
        }

        /* 下方双栏：日志 + 日程 */
        .content-row {
            display: flex;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }

        .content-row .card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding-bottom: 12px;
        }

        .log-area,
        .schedule-area {
            flex: 1;
            min-height: 140px;
            border: 1px dashed #d0d9e2;
            border-radius: 6px;
            background: #f8fafc;
            padding: 12px;
        }

        .log-area {
            height: 180px;
            max-height: 180px;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #c5d0db transparent;
        }

        .log-area::-webkit-scrollbar {
            width: 6px;
        }

        .log-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-area::-webkit-scrollbar-thumb {
            background: #c5d0db;
            border-radius: 3px;
        }

        .log-area::-webkit-scrollbar-thumb:hover {
            background: #aab8c4;
        }

        .schedule-area {
            height: 180px;
            max-height: 180px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
            border: none;
            background: transparent;
        }

        .schedule-calendar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 8px;
            color: #ffffff;
        }

        .calendar-date {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .calendar-day {
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
        }

        .calendar-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .calendar-month {
            font-size: 13px;
            font-weight: 600;
        }

        .calendar-weekday {
            font-size: 11px;
            opacity: 0.85;
        }

        .calendar-badge {
            font-size: 11px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            white-space: nowrap;
        }

        .schedule-list {
            flex: 1;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            padding-right: 2px;
            scrollbar-width: thin;
            scrollbar-color: #c5d0db transparent;
        }

        .schedule-list::-webkit-scrollbar {
            width: 6px;
        }

        .schedule-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .schedule-list::-webkit-scrollbar-thumb {
            background: #c5d0db;
            border-radius: 3px;
        }

        .schedule-list::-webkit-scrollbar-thumb:hover {
            background: #aab8c4;
        }

        .schedule-item {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #ffffff;
            border: 1px solid #e8edf2;
            border-radius: 8px;
            border-left: 3px solid #3b82f6;
            transition: box-shadow 0.15s ease;
        }

        .schedule-item:last-child {
            margin-bottom: 0;
        }

        .schedule-item:nth-child(2) {
            border-left-color: #10b981;
        }

        .schedule-item:nth-child(3) {
            border-left-color: #f59e0b;
        }

        .schedule-item:nth-child(4) {
            border-left-color: #8b5cf6;
        }

        .schedule-item:nth-child(5) {
            border-left-color: #ec4899;
        }

        .schedule-time-block {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 44px;
            padding-top: 2px;
        }

        .schedule-time {
            font-size: 13px;
            font-weight: 700;
            color: #2563eb;
            line-height: 1.2;
        }

        .schedule-item:nth-child(2) .schedule-time {
            color: #059669;
        }

        .schedule-item:nth-child(3) .schedule-time {
            color: #d97706;
        }

        .schedule-item:nth-child(4) .schedule-time {
            color: #7c3aed;
        }

        .schedule-item:nth-child(5) .schedule-time {
            color: #db2777;
        }

        .schedule-duration {
            font-size: 10px;
            color: #aab8c4;
            margin-top: 2px;
        }

        .schedule-body {
            flex: 1;
            min-width: 0;
        }

        .schedule-title {
            font-size: 13px;
            font-weight: 600;
            color: #1a2b3c;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .log-entry {
            font-size: 12px;
            color: #4a5f73;
            margin-bottom: 6px;
            line-height: 1.5;
            word-break: break-word;
        }

        .log-entry.error {
            color: #dc2626;
        }

        .empty-hint {
            color: #aab8c4;
            font-size: 12px;
            text-align: center;
            padding-top: 40px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>语音日历工具</h1>
            <p>语音输入 · 智能识别 · 日程管理</p>
        </header>

        <main class="main">
            <!-- 配置区域 -->
            <section class="card">
                <div class="card-title">配置</div>
                <div class="config-row">
                    <label for="api-key">阿里云 API Key</label>
                    <input type="password" id="api-key" name="api-key" placeholder="请输入阿里云 API Key">
                    <button type="button" id="btn-save-config" class="btn btn-primary">保存配置</button>
                </div>
            </section>

            <!-- 语音操作区域 -->
            <section class="card">
                <div class="card-title">语音操作</div>
                <div class="voice-section">
                    <button type="button" id="btn-voice" class="btn-voice">按住说话</button>
                    <p class="voice-hint">按住按钮开始录音，松开后自动识别</p>
                </div>
            </section>

            <!-- 状态日志 + 日程列表 -->
            <div class="content-row">
                <section class="card">
                    <div class="card-title">状态日志</div>
                    <div class="log-area" id="log-area">
                        <p class="empty-hint">识别结果与运行状态将在此显示</p>
                    </div>
                </section>

                <section class="card">
                    <div class="card-title">日程列表</div>
                    <div class="schedule-area">
                        <div class="schedule-calendar">
                            <div class="calendar-date">
                                <span class="calendar-day">29</span>
                                <div class="calendar-meta">
                                    <span class="calendar-month">2026 年 5 月</span>
                                    <span class="calendar-weekday">星期四</span>
                                </div>
                            </div>
                            <span class="calendar-badge">今日 5 项日程</span>
                        </div>
                        <div class="schedule-list">
                            <article class="schedule-item">
                                <div class="schedule-time-block">
                                    <span class="schedule-time">09:00</span>
                                    <span class="schedule-duration">1h</span>
                                </div>
                                <div class="schedule-body">
                                    <h3 class="schedule-title">团队晨会</h3>
                                    <p class="schedule-note">讨论本周开发进度与任务分配</p>
                                </div>
                            </article>
                            <article class="schedule-item">
                                <div class="schedule-time-block">
                                    <span class="schedule-time">11:30</span>
                                    <span class="schedule-duration">30m</span>
                                </div>
                                <div class="schedule-body">
                                    <h3 class="schedule-title">产品需求评审</h3>
                                    <p class="schedule-note">确认语音日历下一版本功能范围</p>
                                </div>
                            </article>
                            <article class="schedule-item">
                                <div class="schedule-time-block">
                                    <span class="schedule-time">14:00</span>
                                    <span class="schedule-duration">2h</span>
                                </div>
                                <div class="schedule-body">
                                    <h3 class="schedule-title">代码开发</h3>
                                    <p class="schedule-note">实现语音转日程与本地存储模块</p>
                                </div>
                            </article>
                            <article class="schedule-item">
                                <div class="schedule-time-block">
                                    <span class="schedule-time">16:30</span>
                                    <span class="schedule-duration">45m</span>
                                </div>
                                <div class="schedule-body">
                                    <h3 class="schedule-title">技术分享</h3>
                                    <p class="schedule-note">Wails 桌面应用开发实践经验交流</p>
                                </div>
                            </article>
                            <article class="schedule-item">
                                <div class="schedule-time-block">
                                    <span class="schedule-time">18:00</span>
                                    <span class="schedule-duration">1h</span>
                                </div>
                                <div class="schedule-body">
                                    <h3 class="schedule-title">健身</h3>
                                    <p class="schedule-note">下班后有氧运动，保持作息规律</p>
                                </div>
                            </article>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script type="module">
        import { SaveApiKey, RecognizeSpeech } from './wailsjs/go/main/App.js';

        const saveBtn = document.getElementById('btn-save-config');
        const apiKeyInput = document.getElementById('api-key');
        const logArea = document.getElementById('log-area');

        function appendLog(message, isError = false) {
            const emptyHint = logArea.querySelector('.empty-hint');
            if (emptyHint) {
                emptyHint.remove();
            }

            const entry = document.createElement('p');
            entry.className = isError ? 'log-entry error' : 'log-entry';
            entry.textContent = message;
            logArea.appendChild(entry);

            requestAnimationFrame(() => {
                logArea.scrollTop = logArea.scrollHeight;
            });
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const dataUrl = reader.result;
                    resolve(dataUrl.split(',')[1]);
                };
                reader.onerror = () => reject(new Error('音频数据读取失败'));
                reader.readAsDataURL(blob);
            });
        }

        function mimeToFormat(mimeType) {
            if (mimeType.includes('webm')) return 'webm';
            if (mimeType.includes('ogg')) return 'opus';
            if (mimeType.includes('wav')) return 'wav';
            if (mimeType.includes('mp3')) return 'mp3';
            return 'webm';
        }

        async function recognizeAudio(blob, mimeType) {
            try {
                appendLog('正在识别语音...');
                const base64 = await blobToBase64(blob);
                const format = mimeToFormat(mimeType);
                const text = await RecognizeSpeech(base64, mimeType, format);
                appendLog('识别结果：' + text);
            } catch (err) {
                appendLog(err.message || String(err), true);
            }
        }

        saveBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                appendLog('API Key不能为空，请输入', true);
                return;
            }

            try {
                await SaveApiKey(key);
                appendLog('API Key 保存成功');
            } catch (err) {
                appendLog(err.message || String(err), true);
            }
        });

        // 语音录制，结束后调用后端语音识别
        const voiceBtn = document.getElementById('btn-voice');
        let mediaRecorder = null;
        let mediaStream = null;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let isRecording = false;
        let pendingStop = false;

        function cleanupMediaStream() {
            if (mediaStream) {
                mediaStream.getTracks().forEach((track) => track.stop());
                mediaStream = null;
            }
        }

        async function startRecording() {
            if (isRecording) {
                return;
            }

            pendingStop = false;

            if (!navigator.mediaDevices || typeof MediaRecorder === 'undefined') {
                appendLog('当前环境不支持录音功能', true);
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(mediaStream);

                mediaRecorder.addEventListener('dataavailable', (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                });

                mediaRecorder.addEventListener('stop', async () => {
                    const mimeType = mediaRecorder.mimeType || 'audio/webm';
                    recordedAudioBlob = new Blob(audioChunks, { type: mimeType });
                    cleanupMediaStream();
                    isRecording = false;
                    pendingStop = false;
                    mediaRecorder = null;
                    appendLog('录音结束');

                    if (!recordedAudioBlob.size) {
                        appendLog('录音数据为空，请重新录制', true);
                        return;
                    }

                    await recognizeAudio(recordedAudioBlob, mimeType);
                });

                mediaRecorder.start();
                isRecording = true;
                appendLog('开始录音');

                if (pendingStop) {
                    stopRecording();
                }
            } catch (err) {
                cleanupMediaStream();
                isRecording = false;
                mediaRecorder = null;

                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    appendLog('无法访问麦克风，请检查权限设置', true);
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    appendLog('未检测到可用麦克风设备', true);
                } else {
                    appendLog('麦克风启动失败：' + (err.message || String(err)), true);
                }
            }
        }

        function stopRecording() {
            if (!isRecording || !mediaRecorder) {
                pendingStop = true;
                return;
            }

            if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        voiceBtn.addEventListener('mousedown', (event) => {
            event.preventDefault();
            startRecording();
        });

        voiceBtn.addEventListener('mouseup', () => {
            stopRecording();
        });

        voiceBtn.addEventListener('mouseleave', () => {
            stopRecording();
        });
    </script>
</body>
</html>

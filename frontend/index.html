<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音日历工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(160deg, #f0f4f8 0%, #e8edf2 100%);
            color: #2c3e50;
            font-size: 14px;
            line-height: 1.5;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 24px 32px;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a2b3c;
            letter-spacing: 0.5px;
        }

        .header p {
            margin-top: 4px;
            font-size: 12px;
            color: #8899a6;
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 720px;
            flex: 1;
            min-height: 0;
        }

        .card {
            background: #ffffff;
            border: 1px solid #dde3ea;
            border-radius: 10px;
            padding: 16px 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #4a5f73;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eef2f6;
        }

        /* 配置区域 */
        .config-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .config-row label {
            flex-shrink: 0;
            font-size: 13px;
            color: #5a6d7e;
            white-space: nowrap;
        }

        .config-row input {
            flex: 1;
            height: 36px;
            padding: 0 12px;
            border: 1px solid #cdd6df;
            border-radius: 6px;
            font-size: 13px;
            color: #2c3e50;
            background: #fafbfc;
            outline: none;
        }

        .config-row input::placeholder {
            color: #aab8c4;
        }

        .btn {
            flex-shrink: 0;
            height: 36px;
            padding: 0 18px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: default;
            white-space: nowrap;
        }

        .btn-primary {
            background: #3b82f6;
            color: #ffffff;
        }

        /* 语音操作区域 */
        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 12px;
        }

        .btn-voice {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            background: linear-gradient(145deg, #eff6ff 0%, #dbeafe 100%);
            color: #2563eb;
            font-size: 15px;
            font-weight: 600;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .voice-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #8899a6;
        }

        /* 下方双栏：日志 + 日程 */
        .content-row {
            display: flex;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }

        .content-row .card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding-bottom: 12px;
        }

        .log-area,
        .schedule-area {
            flex: 1;
            min-height: 140px;
            border: 1px dashed #d0d9e2;
            border-radius: 6px;
            background: #f8fafc;
            padding: 12px;
        }

        .log-area {
            height: 180px;
            max-height: 180px;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #c5d0db transparent;
        }

        .log-area::-webkit-scrollbar {
            width: 6px;
        }

        .log-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-area::-webkit-scrollbar-thumb {
            background: #c5d0db;
            border-radius: 3px;
        }

        .log-area::-webkit-scrollbar-thumb:hover {
            background: #aab8c4;
        }

        .schedule-area {
            height: 180px;
            max-height: 180px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
            border: none;
            background: transparent;
        }

        .schedule-calendar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            transition: box-shadow 0.15s ease, transform 0.15s ease;
        }

        .schedule-calendar:hover {
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .schedule-calendar:active {
            transform: scale(0.98);
        }

        .calendar-date {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .calendar-day {
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
        }

        .calendar-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .calendar-month {
            font-size: 13px;
            font-weight: 600;
        }

        .calendar-weekday {
            font-size: 11px;
            opacity: 0.85;
        }

        .calendar-badge {
            font-size: 11px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            white-space: nowrap;
        }

        .schedule-list {
            flex: 1;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            padding-right: 2px;
            scrollbar-width: thin;
            scrollbar-color: #c5d0db transparent;
        }

        .schedule-list::-webkit-scrollbar {
            width: 6px;
        }

        .schedule-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .schedule-list::-webkit-scrollbar-thumb {
            background: #c5d0db;
            border-radius: 3px;
        }

        .schedule-list::-webkit-scrollbar-thumb:hover {
            background: #aab8c4;
        }

        .schedule-item {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #ffffff;
            border: 1px solid #e8edf2;
            border-radius: 8px;
            border-left: 3px solid #3b82f6;
            transition: box-shadow 0.15s ease;
        }

        .schedule-item:last-child {
            margin-bottom: 0;
        }

        .schedule-item:nth-child(2) {
            border-left-color: #10b981;
        }

        .schedule-item:nth-child(3) {
            border-left-color: #f59e0b;
        }

        .schedule-item:nth-child(4) {
            border-left-color: #8b5cf6;
        }

        .schedule-item:nth-child(5) {
            border-left-color: #ec4899;
        }

        .schedule-time-block {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 44px;
            padding-top: 2px;
        }

        .schedule-time {
            font-size: 13px;
            font-weight: 700;
            color: #2563eb;
            line-height: 1.2;
        }

        .schedule-item:nth-child(2) .schedule-time {
            color: #059669;
        }

        .schedule-item:nth-child(3) .schedule-time {
            color: #d97706;
        }

        .schedule-item:nth-child(4) .schedule-time {
            color: #7c3aed;
        }

        .schedule-item:nth-child(5) .schedule-time {
            color: #db2777;
        }

        .schedule-duration {
            font-size: 10px;
            color: #aab8c4;
            margin-top: 2px;
        }

        .schedule-body {
            flex: 1;
            min-width: 0;
        }

        .schedule-title {
            font-size: 13px;
            font-weight: 600;
            color: #1a2b3c;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .schedule-note {
            font-size: 11px;
            color: #8899a6;
            line-height: 1.4;
            word-break: break-word;
        }

        .schedule-empty {
            text-align: center;
            padding: 32px 12px;
            font-size: 12px;
            color: #aab8c4;
        }

        /* 日历选择器弹层 */
        .calendar-picker-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(26, 43, 60, 0.35);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .calendar-picker-overlay.open {
            display: flex;
        }

        .calendar-picker {
            width: 300px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            padding: 16px;
            border: 1px solid #dde3ea;
        }

        .calendar-picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .calendar-picker-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a2b3c;
        }

        .calendar-nav-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #dde3ea;
            border-radius: 6px;
            background: #f8fafc;
            color: #4a5f73;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-nav-btn:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #2563eb;
        }

        .calendar-picker-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 6px;
        }

        .calendar-picker-weekdays span {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #8899a6;
            padding: 4px 0;
        }

        .calendar-picker-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .calendar-day-cell {
            position: relative;
            aspect-ratio: 1;
            border: none;
            border-radius: 6px;
            background: transparent;
            font-size: 13px;
            color: #4a5f73;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-day-cell.has-schedule::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .calendar-day-cell.has-schedule.selected::after {
            background: #ffffff;
        }

        .schedule-item.voice-created {
            border-left-color: #10b981;
        }

        .schedule-item.voice-created .schedule-time {
            color: #059669;
        }

        .calendar-day-cell:hover:not(:disabled) {
            background: #eff6ff;
            color: #2563eb;
        }

        .calendar-day-cell.other-month {
            color: #c5d0db;
        }

        .calendar-day-cell.today {
            border: 1px solid #3b82f6;
            font-weight: 600;
        }

        .calendar-day-cell.selected {
            background: #3b82f6;
            color: #ffffff;
            font-weight: 600;
        }

        .calendar-day-cell.selected.today {
            border-color: #2563eb;
        }

        .calendar-day-cell:disabled {
            cursor: default;
            visibility: hidden;
        }

        .log-entry {
            font-size: 12px;
            color: #4a5f73;
            margin-bottom: 6px;
            line-height: 1.5;
            word-break: break-word;
        }

        .log-entry.error {
            color: #dc2626;
        }

        .empty-hint {
            color: #aab8c4;
            font-size: 12px;
            text-align: center;
            padding-top: 40px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>语音日历工具</h1>
            <p>语音输入 · 智能识别 · 日程管理</p>
        </header>

        <main class="main">
            <!-- 配置区域 -->
            <section class="card">
                <div class="card-title">配置</div>
                <div class="config-row">
                    <label for="api-key">阿里云 API Key</label>
                    <input type="password" id="api-key" name="api-key" placeholder="请输入阿里云 API Key">
                    <button type="button" id="btn-save-config" class="btn btn-primary">保存配置</button>
                </div>
            </section>

            <!-- 语音操作区域 -->
            <section class="card">
                <div class="card-title">语音操作</div>
                <div class="voice-section">
                    <button type="button" id="btn-voice" class="btn-voice">按住说话</button>
                    <p class="voice-hint">按住按钮开始录音，松开后自动识别</p>
                </div>
            </section>

            <!-- 状态日志 + 日程列表 -->
            <div class="content-row">
                <section class="card">
                    <div class="card-title">状态日志</div>
                    <div class="log-area" id="log-area">
                        <p class="empty-hint">识别结果与运行状态将在此显示</p>
                    </div>
                </section>

                <section class="card">
                    <div class="card-title">日程列表</div>
                    <div class="schedule-area">
                        <div class="schedule-calendar" id="schedule-date-card" title="点击选择日期">
                            <div class="calendar-date">
                                <span class="calendar-day" id="calendar-display-day">29</span>
                                <div class="calendar-meta">
                                    <span class="calendar-month" id="calendar-display-month">2026 年 5 月</span>
                                    <span class="calendar-weekday" id="calendar-display-weekday">星期四</span>
                                </div>
                            </div>
                            <span class="calendar-badge" id="calendar-display-badge">今日 5 项日程</span>
                        </div>
                        <div class="schedule-list" id="schedule-list"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="calendar-picker-overlay" id="calendar-picker-overlay">
        <div class="calendar-picker" id="calendar-picker">
            <div class="calendar-picker-header">
                <button type="button" class="calendar-nav-btn" id="calendar-prev-month" aria-label="上一月">‹</button>
                <span class="calendar-picker-title" id="calendar-picker-title">2026 年 5 月</span>
                <button type="button" class="calendar-nav-btn" id="calendar-next-month" aria-label="下一月">›</button>
            </div>
            <div class="calendar-picker-weekdays">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="calendar-picker-days" id="calendar-picker-days"></div>
        </div>
    </div>

    <script type="module">
        import { SaveApiKey, RecognizeSpeech, ParseSchedule } from './wailsjs/go/main/App.js';

        const saveBtn = document.getElementById('btn-save-config');
        const apiKeyInput = document.getElementById('api-key');
        const logArea = document.getElementById('log-area');

        function appendLog(message, isError = false) {
            const emptyHint = logArea.querySelector('.empty-hint');
            if (emptyHint) {
                emptyHint.remove();
            }

            const entry = document.createElement('p');
            entry.className = isError ? 'log-entry error' : 'log-entry';
            entry.textContent = message;
            logArea.appendChild(entry);

            requestAnimationFrame(() => {
                logArea.scrollTop = logArea.scrollHeight;
            });
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const dataUrl = reader.result;
                    resolve(dataUrl.split(',')[1]);
                };
                reader.onerror = () => reject(new Error('音频数据读取失败'));
                reader.readAsDataURL(blob);
            });
        }

        function mimeToFormat(mimeType) {
            if (mimeType.includes('webm')) return 'webm';
            if (mimeType.includes('ogg')) return 'opus';
            if (mimeType.includes('wav')) return 'wav';
            if (mimeType.includes('mp3')) return 'mp3';
            return 'webm';
        }

        async function recognizeAudio(blob, mimeType) {
            try {
                appendLog('正在识别语音...');
                const base64 = await blobToBase64(blob);
                const format = mimeToFormat(mimeType);
                const text = await RecognizeSpeech(base64, mimeType, format);
                appendLog('识别结果：' + text);
                // 识别完成后调用大模型解析并生成日程
                await createScheduleFromVoice(text);
            } catch (err) {
                appendLog(err.message || String(err), true);
            }
        }

        saveBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                appendLog('API Key不能为空，请输入', true);
                return;
            }

            try {
                await SaveApiKey(key);
                appendLog('API Key 保存成功');
            } catch (err) {
                appendLog(err.message || String(err), true);
            }
        });

        // 语音录制，结束后调用后端语音识别
        const voiceBtn = document.getElementById('btn-voice');
        let mediaRecorder = null;
        let mediaStream = null;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let isRecording = false;
        let pendingStop = false;

        function cleanupMediaStream() {
            if (mediaStream) {
                mediaStream.getTracks().forEach((track) => track.stop());
                mediaStream = null;
            }
        }

        async function startRecording() {
            if (isRecording) {
                return;
            }

            pendingStop = false;

            if (!navigator.mediaDevices || typeof MediaRecorder === 'undefined') {
                appendLog('当前环境不支持录音功能', true);
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(mediaStream);

                mediaRecorder.addEventListener('dataavailable', (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                });

                mediaRecorder.addEventListener('stop', async () => {
                    const mimeType = mediaRecorder.mimeType || 'audio/webm';
                    recordedAudioBlob = new Blob(audioChunks, { type: mimeType });
                    cleanupMediaStream();
                    isRecording = false;
                    pendingStop = false;
                    mediaRecorder = null;
                    appendLog('录音结束');

                    if (!recordedAudioBlob.size) {
                        appendLog('录音数据为空，请重新录制', true);
                        return;
                    }

                    await recognizeAudio(recordedAudioBlob, mimeType);
                });

                mediaRecorder.start();
                isRecording = true;
                appendLog('开始录音');

                if (pendingStop) {
                    stopRecording();
                }
            } catch (err) {
                cleanupMediaStream();
                isRecording = false;
                mediaRecorder = null;

                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    appendLog('无法访问麦克风，请检查权限设置', true);
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    appendLog('未检测到可用麦克风设备', true);
                } else {
                    appendLog('麦克风启动失败：' + (err.message || String(err)), true);
                }
            }
        }

        function stopRecording() {
            if (!isRecording || !mediaRecorder) {
                pendingStop = true;
                return;
            }

            if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        voiceBtn.addEventListener('mousedown', (event) => {
            event.preventDefault();
            startRecording();
        });

        voiceBtn.addEventListener('mouseup', () => {
            stopRecording();
        });

        voiceBtn.addEventListener('mouseleave', () => {
            stopRecording();
        });

        // 日历选择器（模拟日程数据）
        const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        const scheduleDateCard = document.getElementById('schedule-date-card');
        const scheduleList = document.getElementById('schedule-list');
        const calendarOverlay = document.getElementById('calendar-picker-overlay');
        const calendarPicker = document.getElementById('calendar-picker');
        const calendarPickerTitle = document.getElementById('calendar-picker-title');
        const calendarPickerDays = document.getElementById('calendar-picker-days');
        const calendarPrevMonth = document.getElementById('calendar-prev-month');
        const calendarNextMonth = document.getElementById('calendar-next-month');
        const calendarDisplayDay = document.getElementById('calendar-display-day');
        const calendarDisplayMonth = document.getElementById('calendar-display-month');
        const calendarDisplayWeekday = document.getElementById('calendar-display-weekday');
        const calendarDisplayBadge = document.getElementById('calendar-display-badge');

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        let selectedDate = new Date(2026, 4, 29);
        let pickerViewYear = selectedDate.getFullYear();
        let pickerViewMonth = selectedDate.getMonth();

        // ── 日程内存存储（前端数组，不持久化）──────────────────────
        // 标准日程对象：{ title, date: 'YYYY-MM-DD', time: 'HH:mm', desc, isVoice?, createdAt? }
        const scheduleStore = [];

        function pad2(n) {
            return String(n).padStart(2, '0');
        }

        function formatISO(date) {
            return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
        }

        function parseISO(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatRelativeDateLabel(dateStr) {
            const d = parseISO(dateStr);
            const diff = Math.round((d - today) / 86400000);
            if (diff === 0) return '今天';
            if (diff === 1) return '明天';
            if (diff === 2) return '后天';
            return `${d.getMonth() + 1}月${d.getDate()}日`;
        }

        /**
         * 将语音识别文本通过大模型解析为日程并加入列表
         * 解析失败时降级：使用原文作为标题
         */
        async function createScheduleFromVoice(text) {
            const desc = text.trim();
            let title = desc || '语音日程';
            let date = null;
            let time = null;

            try {
                appendLog('正在调用大模型解析日程...');
                const result = await ParseSchedule(desc);
                title = (result.title || '').trim() || desc || '语音日程';
                date = (result.date || '').trim() || null;
                time = (result.time || '').trim() || null;

                if (date && time) {
                    appendLog(`大模型解析成功：${title}（${date} ${time}）`);
                } else if (date || time) {
                    appendLog(`大模型解析部分成功：${title}（${date || '日期待定'} ${time || '时间待定'}）`);
                } else {
                    appendLog('大模型未能识别日期/时间，已保留原文作为标题', true);
                }
            } catch (err) {
                appendLog('大模型解析失败，已使用原文：' + (err.message || String(err)), true);
            }

            const schedule = {
                title,
                date: date || formatISO(today),
                time: time || '09:00',
                desc: desc,
                isVoice: true,
                createdAt: Date.now(),
            };

            if (date && time) {
                const label = formatRelativeDateLabel(schedule.date);
                appendLog(`已生成日程：${schedule.title}（${label}${schedule.time}）`);
            } else if (!date && !time) {
                schedule.title = desc || '语音日程';
            }

            scheduleStore.unshift(schedule);

            selectedDate = parseISO(schedule.date);
            updateDateDisplay(selectedDate);

            if (calendarOverlay.classList.contains('open')) {
                renderCalendarPicker();
            }
        }

        function dateKey(date) {
            return formatISO(date);
        }

        function isSameDay(a, b) {
            return a.getFullYear() === b.getFullYear()
                && a.getMonth() === b.getMonth()
                && a.getDate() === b.getDate();
        }

        function hasSchedulesOnDate(date) {
            const key = dateKey(date);
            return scheduleStore.some((s) => s.date === key);
        }

        function getSchedulesForDate(date) {
            const key = dateKey(date);
            return scheduleStore
                .filter((s) => s.date === key)
                .sort((a, b) => {
                    if (a.isVoice && !b.isVoice) return -1;
                    if (!a.isVoice && b.isVoice) return 1;
                    if (a.isVoice && b.isVoice) return (b.createdAt || 0) - (a.createdAt || 0);
                    return a.time.localeCompare(b.time);
                });
        }

        function renderScheduleList(date) {
            const items = getSchedulesForDate(date);
            if (!items.length) {
                scheduleList.innerHTML = '<p class="schedule-empty">该日期暂无日程安排</p>';
                return;
            }
            scheduleList.innerHTML = items.map((item) => `
                <article class="schedule-item${item.isVoice ? ' voice-created' : ''}">
                    <div class="schedule-time-block">
                        <span class="schedule-time">${item.time}</span>
                    </div>
                    <div class="schedule-body">
                        <h3 class="schedule-title">${item.title}</h3>
                        <p class="schedule-note">${item.desc}</p>
                    </div>
                </article>
            `).join('');
        }

        function updateDateDisplay(date) {
            calendarDisplayDay.textContent = date.getDate();
            calendarDisplayMonth.textContent = `${date.getFullYear()} 年 ${date.getMonth() + 1} 月`;
            calendarDisplayWeekday.textContent = WEEKDAYS[date.getDay()];
            const count = getSchedulesForDate(date).length;
            const prefix = isSameDay(date, today) ? '今日' : '当日';
            calendarDisplayBadge.textContent = `${prefix} ${count} 项日程`;
            renderScheduleList(date);
        }

        function renderCalendarPicker() {
            calendarPickerTitle.textContent = `${pickerViewYear} 年 ${pickerViewMonth + 1} 月`;
            calendarPickerDays.innerHTML = '';

            const firstDay = new Date(pickerViewYear, pickerViewMonth, 1);
            const startWeekday = firstDay.getDay();
            const daysInMonth = new Date(pickerViewYear, pickerViewMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(pickerViewYear, pickerViewMonth, 0).getDate();

            for (let i = 0; i < startWeekday; i++) {
                const day = daysInPrevMonth - startWeekday + i + 1;
                calendarPickerDays.appendChild(createDayCell(day, pickerViewYear, pickerViewMonth - 1, true));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                calendarPickerDays.appendChild(createDayCell(day, pickerViewYear, pickerViewMonth, false));
            }

            const totalCells = calendarPickerDays.children.length;
            const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let day = 1; day <= remaining; day++) {
                calendarPickerDays.appendChild(createDayCell(day, pickerViewYear, pickerViewMonth + 1, true));
            }
        }

        function createDayCell(day, year, month, isOtherMonth) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'calendar-day-cell';
            btn.textContent = day;

            const cellDate = new Date(year, month, day);
            if (isOtherMonth) {
                btn.classList.add('other-month');
            }
            if (isSameDay(cellDate, today)) {
                btn.classList.add('today');
            }
            if (isSameDay(cellDate, selectedDate)) {
                btn.classList.add('selected');
            }
            if (hasSchedulesOnDate(cellDate)) {
                btn.classList.add('has-schedule');
            }

            btn.addEventListener('click', () => {
                selectedDate = new Date(cellDate);
                updateDateDisplay(selectedDate);
                closeCalendarPicker();
            });

            return btn;
        }

        function openCalendarPicker() {
            pickerViewYear = selectedDate.getFullYear();
            pickerViewMonth = selectedDate.getMonth();
            renderCalendarPicker();
            calendarOverlay.classList.add('open');
        }

        function closeCalendarPicker() {
            calendarOverlay.classList.remove('open');
        }

        scheduleDateCard.addEventListener('click', openCalendarPicker);

        calendarPrevMonth.addEventListener('click', (e) => {
            e.stopPropagation();
            pickerViewMonth -= 1;
            if (pickerViewMonth < 0) {
                pickerViewMonth = 11;
                pickerViewYear -= 1;
            }
            renderCalendarPicker();
        });

        calendarNextMonth.addEventListener('click', (e) => {
            e.stopPropagation();
            pickerViewMonth += 1;
            if (pickerViewMonth > 11) {
                pickerViewMonth = 0;
                pickerViewYear += 1;
            }
            renderCalendarPicker();
        });

        calendarOverlay.addEventListener('click', (e) => {
            if (e.target === calendarOverlay) {
                closeCalendarPicker();
            }
        });

        calendarPicker.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        updateDateDisplay(selectedDate);
    </script>
</body>
</html>

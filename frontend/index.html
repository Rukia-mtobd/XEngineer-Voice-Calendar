<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceFlow Calendar</title>
  <style>
    :root{
      --bg:#f5f5f7;
      --surface:rgba(255,255,255,.78);
      --surface-2:rgba(250,250,252,.9);
      --text:#1d1d1f;
      --muted:rgba(122,122,122,.92);
      --line:rgba(0,0,0,.08);
      --accent:#0066cc;
      --accent-soft:rgba(0,102,204,.14);
      --accent-strong:#0071e3;
      --radius:1rem;
      --font:"SF Pro Text","SF Pro Display","Segoe UI Variable","Segoe UI",Inter,sans-serif;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;height:100%;overflow:hidden;
      background:radial-gradient(circle at 20% 0%,#ffffff 0%,#f5f5f7 68%);
      color:var(--text);
      font-family:var(--font);
      font-size:clamp(13px,.95vw,16px);
      letter-spacing:-0.02em;
    }
    .app{
      height:100%;
      display:grid;
      grid-template-rows:auto auto minmax(0,1fr) auto;
      gap:clamp(.45rem,.8vw,.7rem);
      padding:clamp(.5rem,.85vw,.8rem);
    }

    .top{
      min-height:3.5rem;
      height:clamp(56px,6vh,64px);
      border:1px solid var(--line);
      border-radius:1rem;
      background:var(--surface);
      backdrop-filter:saturate(180%) blur(20px);
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:.5rem;
      padding:0 clamp(.6rem,1vw,1rem);
      min-width:0;
    }
    .left,.right{display:flex;align-items:center;gap:.4rem;min-width:0}
    .right{justify-self:end}
    .logo-dot{width:.5rem;height:.5rem;border-radius:999px;background:var(--accent);flex-shrink:0}
    .brand{font-size:clamp(.82rem,.95vw,1rem);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .center{
      display:flex;align-items:center;gap:.45rem;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      font-size:clamp(.74rem,.82vw,.9rem);color:var(--muted);
    }
    .today-btn{
      border:1px solid var(--accent-soft);background:var(--accent-soft);color:var(--accent-strong);
      border-radius:999px;padding:.22rem .56rem;font-size:clamp(.66rem,.72vw,.78rem);cursor:pointer
    }
    .icon-btn{
      border:0;background:transparent;color:var(--muted);padding:.36rem .45rem;border-radius:.45rem;
      font-size:clamp(.7rem,.74vw,.8rem);cursor:pointer;white-space:nowrap
    }
    .icon-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}
    .sync-pill{
      border:1px solid var(--accent-soft);background:var(--accent-soft);color:var(--accent-strong);
      border-radius:999px;padding:.2rem .5rem;font-size:clamp(.64rem,.7vw,.76rem);white-space:nowrap
    }

    .switch{
      min-height:2.6rem;
      border:1px solid var(--line);
      border-radius:1rem;
      background:var(--surface);
      backdrop-filter:saturate(180%) blur(18px);
      display:flex;align-items:center;justify-content:space-between;gap:.6rem;
      padding:.45rem .6rem;
    }
    .seg{
      display:inline-flex;align-items:center;gap:.2rem;background:rgba(0,0,0,.04);padding:.2rem;border-radius:999px
    }
    .seg-btn{
      border:0;background:transparent;color:var(--muted);border-radius:999px;padding:.26rem .62rem;
      font-size:clamp(.68rem,.74vw,.8rem);cursor:pointer
    }
    .seg-btn.active{background:var(--accent-soft);color:var(--accent-strong)}

    .main{
      min-height:0;
      border:1px solid var(--line);
      border-radius:1rem;
      background:var(--surface);
      backdrop-filter:saturate(180%) blur(18px);
      display:grid;
      grid-template-rows:minmax(0,.68fr) minmax(0,.32fr);
      gap:.55rem;
      padding:.55rem;
      overflow:hidden;
    }

    .calendar-wrap{
      min-height:0;
      border:1px solid rgba(0,0,0,.06);
      border-radius:.9rem;
      background:var(--surface-2);
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      overflow:hidden;
    }
    .calendar-head{
      display:flex;align-items:center;justify-content:space-between;gap:.5rem;
      padding:.5rem .65rem;border-bottom:1px solid rgba(0,0,0,.06)
    }
    .calendar-title{font-size:clamp(.9rem,1.08vw,1.15rem);font-weight:600;letter-spacing:-.03em}
    .month-nav{display:flex;align-items:center;gap:.22rem}
    .month-btn{border:0;background:transparent;color:var(--muted);border-radius:.42rem;padding:.18rem .42rem;cursor:pointer}
    .month-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}

    .cal-scroll{min-height:0;overflow:auto;padding:.45rem .5rem .62rem;scrollbar-width:thin}
    .cal-scroll::-webkit-scrollbar{width:.35rem;height:.35rem}
    .cal-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:999px}
    .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.2rem;margin-bottom:.2rem}
    .wk{font-size:clamp(.62rem,.66vw,.72rem);color:rgba(122,122,122,.8);text-align:center;padding:.2rem 0}
    .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.22rem}
    .day{
      min-height:clamp(3.2rem,5.3vw,4.4rem);
      border:1px solid rgba(0,0,0,.06);
      border-radius:.55rem;
      background:rgba(255,255,255,.9);
      display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:.16rem;
      padding:.28rem .32rem;cursor:pointer;
    }
    .day:hover{background:rgba(0,0,0,.03)}
    .day.other{opacity:.45}
    .day.today{border-color:rgba(0,102,204,.75);background:var(--accent-soft)}
    .day.selected{outline:1px solid var(--accent-strong)}
    .d-num{font-size:clamp(.72rem,.8vw,.9rem);font-weight:600;line-height:1.25}
    .d-sub{font-size:clamp(.58rem,.62vw,.68rem);line-height:1.2;color:rgba(122,122,122,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .d-dot{margin-top:auto;width:.35rem;height:.35rem;border-radius:999px;background:var(--accent)}

    .events{
      min-height:0;
      border:1px solid rgba(0,0,0,.06);
      border-radius:.9rem;
      background:var(--surface-2);
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      overflow:hidden;
    }
    .events-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.5rem .65rem;border-bottom:1px solid rgba(0,0,0,.06)}
    .events-title{font-size:clamp(.86rem,1vw,1.06rem);font-weight:600;letter-spacing:-.03em}
    .events-scroll{min-height:0;overflow:auto;padding:.45rem .5rem .62rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.45rem}
    .event{
      border:1px solid rgba(0,0,0,.06);border-left:3px solid var(--accent);border-radius:.75rem;background:rgba(255,255,255,.92);
      padding:.5rem .55rem;display:flex;flex-direction:column;gap:.2rem;min-height:0
    }
    .event-title{font-size:clamp(.8rem,.88vw,.96rem);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .event-time{font-size:clamp(.66rem,.74vw,.8rem);color:rgba(122,122,122,.9);font-variant-numeric:tabular-nums}
    .event-sub{font-size:clamp(.64rem,.7vw,.76rem);color:rgba(122,122,122,.85)}
    .ai-tag{display:inline-flex;align-items:center;width:max-content;padding:.13rem .45rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:clamp(.58rem,.64vw,.7rem)}
    .empty{padding:.5rem .2rem;font-size:clamp(.72rem,.82vw,.9rem);color:rgba(122,122,122,.85)}

    .fab{
      position:fixed;right:clamp(12px,1.2vw,20px);bottom:clamp(18px,2vh,26px);z-index:20;
      width:clamp(56px,5vw,70px);height:clamp(56px,5vw,70px);border-radius:999px;border:1px solid rgba(0,0,0,.08);
      background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.98),rgba(242,242,246,.96));
      color:var(--accent);font-size:clamp(26px,2.4vw,34px);line-height:1;cursor:pointer;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
    }
    .fab::after{
      content:"";position:absolute;inset:-8px;border-radius:999px;border:1px solid rgba(0,102,204,.2);opacity:0;
    }
    .fab.listening::after{opacity:1;animation:ripple 1.6s cubic-bezier(.28,.11,.32,1) infinite}

    .status-panel{
      position:fixed;right:clamp(86px,7vw,108px);bottom:clamp(24px,2.6vh,34px);z-index:19;
      min-width:clamp(180px,22vw,300px);max-width:42vw;
      border:1px solid rgba(0,0,0,.08);border-radius:.75rem;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(16px);
      padding:.45rem .56rem;display:none;
    }
    .status-panel.show{display:block}
    .status-title{font-size:clamp(.66rem,.72vw,.78rem);color:var(--muted)}
    .status-body{margin-top:.12rem;font-size:clamp(.72rem,.82vw,.9rem);line-height:1.4;word-break:break-word}

    .toast{
      position:fixed;left:50%;bottom:clamp(16px,2vh,24px);transform:translateX(-50%) translateY(8px);
      background:rgba(29,29,31,.9);color:#fff;border-radius:999px;padding:.5rem .72rem;font-size:clamp(.68rem,.76vw,.84rem);
      opacity:0;pointer-events:none;transition:opacity .26s ease,transform .26s ease;z-index:30;
      max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .mask{position:fixed;inset:0;background:rgba(29,29,31,.16);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .28s ease}
    .mask.open{opacity:1;pointer-events:auto}
    .sheet{position:fixed;right:0;top:0;height:100%;width:min(23rem,92vw);background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(20px);border-left:1px solid rgba(0,0,0,.08);transform:translateX(100%);transition:transform .3s ease;padding:.85rem;display:flex;flex-direction:column;gap:.72rem}
    .sheet.open{transform:translateX(0)}
    .s-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:.45rem;border-bottom:1px solid rgba(0,0,0,.08)}
    .s-title{font-size:clamp(.94rem,1.1vw,1.2rem);font-weight:600}
    .s-close{border:0;background:rgba(0,0,0,.06);color:var(--text);border-radius:.45rem;width:1.85rem;height:1.85rem;cursor:pointer}
    .rows{border-top:1px solid rgba(0,0,0,.08);border-bottom:1px solid rgba(0,0,0,.08)}
    .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.55rem;min-height:2.32rem;border-top:1px solid rgba(0,0,0,.06)}
    .label{font-size:clamp(.7rem,.8vw,.86rem)}
    .value{font-size:clamp(.64rem,.72vw,.78rem);color:var(--muted)}
    .row .seg{display:flex;gap:2px;padding:2px;border:1px solid rgba(0,0,0,.1);border-radius:999px;background:rgba(255,255,255,.82)}
    .row .seg button{border:0;background:transparent;border-radius:999px;padding:.24rem .5rem;font-size:clamp(.64rem,.72vw,.78rem);cursor:pointer;color:var(--muted)}
    .row .seg button.active{background:var(--accent-soft);color:var(--accent)}
    .field{display:flex;flex-direction:column;gap:.35rem}
    .field label{font-size:clamp(.64rem,.72vw,.78rem);color:var(--muted)}
    .field input{height:2.15rem;border:1px solid rgba(0,0,0,.12);border-radius:.5rem;background:rgba(255,255,255,.86);color:var(--text);padding:0 .6rem;font-size:clamp(.72rem,.8vw,.88rem);outline:none}
    .save{height:2.15rem;border:0;border-radius:.5rem;background:var(--accent);color:#fff;cursor:pointer;font-size:clamp(.72rem,.8vw,.88rem)}

    @keyframes ripple{0%{opacity:.52;transform:scale(.98)}100%{opacity:0;transform:scale(1.16)}}

    @media (max-width:1100px){
      .main{grid-template-rows:minmax(0,.62fr) minmax(0,.38fr)}
      .col-month{display:none}
    }
    @media (max-width:860px){
      .main{grid-template-rows:minmax(0,.66fr) minmax(0,.34fr)}
      .col-time{display:none}
      .top{grid-template-columns:1fr auto}
      .center{display:none}
      .right .icon-btn:nth-child(3){display:none}
      .status-panel{max-width:56vw}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="left">
        <span class="logo-dot"></span>
        <span class="brand" data-i18n="header.brand"></span>
      </div>
      <div class="center" id="top-date"></div>
      <div class="right">
        <span class="sync-pill" id="sync-pill"></span>
        <button class="icon-btn" id="btn-today" data-i18n="header.today"></button>
        <button class="icon-btn" id="btn-search" data-i18n="header.search"></button>
        <button class="icon-btn" id="btn-settings" data-i18n="header.settings"></button>
        <button class="icon-btn" id="btn-profile" data-i18n="header.profile"></button>
      </div>
    </header>

    <section class="switch">
      <div class="seg" id="view-seg">
        <button class="seg-btn" data-view="year" data-i18n="view.year"></button>
        <button class="seg-btn active" data-view="month" data-i18n="view.month"></button>
        <button class="seg-btn" data-view="week" data-i18n="view.week"></button>
        <button class="seg-btn" data-view="day" data-i18n="view.day"></button>
        <button class="seg-btn" data-view="agenda" data-i18n="view.agenda"></button>
      </div>
      <span class="sync-pill" id="view-label"></span>
    </section>

    <section class="main">
      <article class="calendar-wrap">
        <div class="calendar-head">
          <h2 class="calendar-title" data-i18n="calendar.title"></h2>
          <div class="month-nav">
            <button class="month-btn" id="month-prev">‹</button>
            <span class="month-title" id="month-caption"></span>
            <button class="month-btn" id="month-next">›</button>
          </div>
        </div>
        <div class="cal-scroll">
          <div class="week" id="week-head"></div>
          <div class="grid" id="month-grid"></div>
        </div>
      </article>

      <article class="events">
        <div class="events-head">
          <h2 class="events-title" data-i18n="events.title"></h2>
          <span class="meta" id="events-meta"></span>
        </div>
        <div class="events-scroll" id="event-list"></div>
      </article>
    </section>
  </div>

  <button class="fab" id="voice-fab" aria-label="+">+</button>
  <section class="status-panel" id="status-panel">
    <div class="status-title" data-i18n="status.title"></div>
    <div class="status-body" id="status-body"></div>
  </section>
  <div class="toast" id="toast"></div>

  <div class="mask" id="settings-mask"></div>
  <aside class="sheet" id="settings-sheet" aria-hidden="true">
    <div class="s-head">
      <h3 class="s-title" data-i18n="settings.title"></h3>
      <button class="s-close" id="settings-close">✕</button>
    </div>
    <div class="rows">
      <div class="row">
        <span class="label" data-i18n="settings.language"></span>
        <div class="seg" id="lang-seg">
          <button data-lang="zh-CN">中文</button>
          <button data-lang="en-US">EN</button>
        </div>
      </div>
      <div class="row"><span class="label" data-i18n="settings.theme"></span><span class="value" data-i18n="settings.themeValue"></span></div>
      <div class="row"><span class="label" data-i18n="settings.mic"></span><span class="value" data-i18n="settings.micValue"></span></div>
      <div class="row"><span class="label" data-i18n="settings.model"></span><span class="value" data-i18n="settings.modelValue"></span></div>
    </div>
    <div class="field">
      <label for="api-key" data-i18n="settings.apiKey"></label>
      <input id="api-key" type="password" />
      <button class="save" id="btn-save" data-i18n="settings.save"></button>
    </div>
  </aside>

  <script type="module">
    import { SaveApiKey, LoadApiKey, RecognizeSpeech, ParseSchedule } from './wailsjs/go/main/App.js';

    const I18N = {
      "zh-CN":{
        header:{brand:"VoiceFlow Calendar",today:"今天",search:"搜索",settings:"设置",profile:"个人",summary:"今日 {{count}} 项"},
        view:{year:"年",month:"月",week:"周",day:"日",agenda:"日程"},
        calendar:{title:"月视图日历"},
        month:{upcoming:"即将到来"},
        events:{title:"当日事件"},
        dock:{idle:"Idle",listening:"Listening",parsing:"Parsing",created:"Created"},
        feed:{listening:"正在监听...",recognized:"已识别：{{text}}",parsing:"正在解析日程...",created:"已创建事件：{{title}}"},
        timeline:{empty:"该日期暂无日程安排",source:"AI 生成"},
        settings:{title:"设置",language:"语言",theme:"主题",themeValue:"深色",mic:"麦克风",micValue:"默认设备",model:"AI 模型",modelValue:"qwen3.6-flash",apiKey:"API Key",save:"保存"},
        status:{title:"AI 解析状态"},
        toast:{created:"已创建事件：{{title}}",goToday:"已跳转到今天"},
        sync:{synced:"已同步",working:"处理中"},
        date:{today:"今天",tomorrow:"明天",after:"后天"},
        weekday:["周日","周一","周二","周三","周四","周五","周六"],
        weekdayShort:["日","一","二","三","四","五","六"],
        lunar:["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"]
      },
      "en-US":{
        header:{brand:"VoiceFlow Calendar",today:"Today",search:"Search",settings:"Settings",profile:"Profile",summary:"{{count}} events today"},
        view:{year:"Year",month:"Month",week:"Week",day:"Day",agenda:"Agenda"},
        calendar:{title:"Month Calendar"},
        month:{upcoming:"Upcoming"},
        events:{title:"Events of Selected Day"},
        dock:{idle:"Idle",listening:"Listening",parsing:"Parsing",created:"Created"},
        feed:{listening:"Listening...",recognized:"Recognized: {{text}}",parsing:"Parsing schedule...",created:"Event created: {{title}}"},
        timeline:{empty:"No events on this day",source:"AI generated"},
        settings:{title:"Settings",language:"Language",theme:"Theme",themeValue:"Dark",mic:"Microphone",micValue:"Default Device",model:"AI Model",modelValue:"qwen3.6-flash",apiKey:"API Key",save:"Save"},
        status:{title:"AI Parsing Status"},
        toast:{created:"Event created: {{title}}",goToday:"Jumped to today"},
        sync:{synced:"Synced",working:"Working"},
        date:{today:"Today",tomorrow:"Tomorrow",after:"Day After Tomorrow"},
        weekday:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
        weekdayShort:["S","M","T","W","T","F","S"],
        lunar:["D1","D2","D3","D4","D5","D6","D7","D8","D9","D10","D11","D12","D13","D14","D15","D16","D17","D18","D19","D20","D21","D22","D23","D24","D25","D26","D27","D28","D29","D30"]
      }
    };

    const el = {
      topDate:document.getElementById("top-date"),
      sync:document.getElementById("sync-pill"),
      btnToday:document.getElementById("btn-today"),
      btnSearch:document.getElementById("btn-search"),
      btnSettings:document.getElementById("btn-settings"),
      btnProfile:document.getElementById("btn-profile"),
      viewSeg:document.getElementById("view-seg"),
      viewLabel:document.getElementById("view-label"),
      monthPrev:document.getElementById("month-prev"),
      monthNext:document.getElementById("month-next"),
      monthCaption:document.getElementById("month-caption"),
      weekHead:document.getElementById("week-head"),
      monthGrid:document.getElementById("month-grid"),
      eventsMeta:document.getElementById("events-meta"),
      eventList:document.getElementById("event-list"),
      voiceFab:document.getElementById("voice-fab"),
      statusPanel:document.getElementById("status-panel"),
      statusBody:document.getElementById("status-body"),
      toast:document.getElementById("toast"),
      mask:document.getElementById("settings-mask"),
      sheet:document.getElementById("settings-sheet"),
      sheetClose:document.getElementById("settings-close"),
      langSeg:document.getElementById("lang-seg"),
      apiKey:document.getElementById("api-key"),
      btnSave:document.getElementById("btn-save")
    };

    const today = new Date(); today.setHours(0,0,0,0);
    const storedLang = localStorage.getItem("voiceflow.locale");
    let lang = storedLang && I18N[storedLang] ? storedLang : ((navigator.language||"").toLowerCase().startsWith("zh") ? "zh-CN" : "en-US");
    let monthCursor = new Date(today.getFullYear(), today.getMonth(), 1);
    let selectedDate = new Date(today);
    let syncState = "synced";
    let currentView = "month";
    const schedules = [];
    let recorder = null, stream = null, chunks = [], isRecording = false, pendingStop = false;
    let toastTimer = null;

    const t = (path,vars={}) => {
      const raw = path.split(".").reduce((a,k)=>a&&a[k],I18N[lang]) || path;
      return String(raw).replace(/\{\{\s*(\w+)\s*\}\}/g,(_,k)=>vars[k] ?? "");
    };
    const iso = (d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const parseISO = (s)=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
    const nowTime = ()=>new Intl.DateTimeFormat(lang,{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
    const relDate = (s)=>{
      const d=parseISO(s), diff=Math.round((d-today)/86400000);
      if(diff===0)return t("date.today");
      if(diff===1)return t("date.tomorrow");
      if(diff===2)return t("date.after");
      return new Intl.DateTimeFormat(lang,{month:"short",day:"numeric"}).format(d);
    };
    const calcDuration = (s,e)=>{
      if(!s||!e)return 0;
      const [sh,sm]=s.split(":").map(Number), [eh,em]=e.split(":").map(Number);
      let mins=(eh*60+em)-(sh*60+sm); if(mins<0) mins+=1440; return mins;
    };
    const durationLabel = (m)=>{
      const v=Number(m)||0;
      if(v<=0) return lang==="zh-CN"?"待定":"TBD";
      if(v%60===0) return `${v/60}h`;
      if(v>60) return `${Math.floor(v/60)}h${v%60}m`;
      return `${v}m`;
    };
    const sortSchedule = (a,b)=>{
      const da=Math.round((parseISO(a.date)-today)/86400000), db=Math.round((parseISO(b.date)-today)/86400000);
      const pa=da===0?0:da>0?da:10000+Math.abs(da), pb=db===0?0:db>0?db:10000+Math.abs(db);
      if(pa!==pb) return pa-pb;
      return (a.startTime||"99:99").localeCompare(b.startTime||"99:99");
    };

    function setSync(state){
      syncState = state;
      el.sync.textContent = state==="working" ? t("sync.working") : t("sync.synced");
    }
    function setStatus(text,show=true){
      el.statusBody.textContent = text;
      el.statusPanel.classList.toggle("show", show);
    }
    function showToast(text){
      clearTimeout(toastTimer);
      el.toast.textContent = text;
      el.toast.classList.add("show");
      toastTimer=setTimeout(()=>el.toast.classList.remove("show"),2200);
    }

    function normalizeSchedule(raw,desc){
      const item={
        title:(raw.title||"").trim() || desc || "Voice Event",
        date:(raw.date||"").trim() || iso(today),
        startTime:(raw.startTime||raw.time||"").trim(),
        endTime:(raw.endTime||"").trim(),
        duration:Number(raw.duration)||0,
        desc:(raw.desc||desc||"").trim()
      };
      if(item.duration<=0 && item.startTime && item.endTime) item.duration=calcDuration(item.startTime,item.endTime);
      return item;
    }

    function renderTop(){
      const todayCount=schedules.filter(s=>s.date===iso(today)).length;
      const dt=new Intl.DateTimeFormat(lang,{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(selectedDate);
      el.topDate.textContent = `${dt} · ${t("header.summary",{count:String(todayCount)})}`;
      el.viewLabel.textContent = I18N[lang].view[currentView] || currentView;
    }

    function renderCalendar(){
      el.monthCaption.textContent = new Intl.DateTimeFormat(lang,{year:"numeric",month:"long"}).format(monthCursor);
      el.weekHead.innerHTML = I18N[lang].weekdayShort.map(w=>`<div class="wk">${w}</div>`).join("");

      const y=monthCursor.getFullYear(), m=monthCursor.getMonth();
      const first=new Date(y,m,1), start=first.getDay(), days=new Date(y,m+1,0).getDate();
      const cells=[];
      for(let i=0;i<start;i++){
        const dPrev = new Date(y,m,0-(start-i-1));
        cells.push(`<button class="day other" data-date="${iso(dPrev)}"><div class="d-num">${dPrev.getDate()}</div><div class="d-sub"></div></button>`);
      }
      for(let d=1; d<=days; d++){
        const c=new Date(y,m,d), key=iso(c);
        const cls=[c.getTime()===today.getTime()?"today":"", c.getTime()===selectedDate.getTime()?"selected":""].filter(Boolean).join(" ");
        const hasEvent = schedules.some(s=>s.date===key);
        const lunarIdx=(d-1)%30;
        const holiday = d===1 ? (lang==="zh-CN"?"儿童节":"Children's Day") : "";
        cells.push(`<button class="day ${cls}" data-date="${key}"><div class="d-num">${d}</div><div class="d-sub">${holiday || I18N[lang].lunar[lunarIdx]}</div>${hasEvent?'<span class="d-dot"></span>':""}</button>`);
      }
      while(cells.length%7!==0){
        const idx=cells.length-(start+days)+1;
        const dNext=new Date(y,m+1,idx);
        cells.push(`<button class="day other" data-date="${iso(dNext)}"><div class="d-num">${dNext.getDate()}</div><div class="d-sub"></div></button>`);
      }
      el.monthGrid.innerHTML = cells.join("");
    }

    function renderEvents(){
      const key=iso(selectedDate);
      const list=schedules.filter(s=>s.date===key).sort(sortSchedule);
      el.eventsMeta.textContent = `${relDate(key)} · ${list.length}`;
      if(!list.length){ el.eventList.innerHTML=`<p class="empty">${t("timeline.empty")}</p>`; return; }
      el.eventList.innerHTML = list.map(it=>{
        const tm=it.startTime&&it.endTime?`${it.startTime}-${it.endTime}`:(it.startTime||"--:--");
        return `<article class="event"><h3 class="event-title">${it.title}</h3><div class="event-time">${tm}</div><div class="event-sub">${durationLabel(it.duration)} · ${t("timeline.source")}</div><span class="ai-tag">AI</span></article>`;
      }).join("");
    }

    function openSettings(){
      el.mask.classList.add("open");
      el.sheet.classList.add("open");
      el.sheet.setAttribute("aria-hidden","false");
    }
    function closeSettings(){
      el.mask.classList.remove("open");
      el.sheet.classList.remove("open");
      el.sheet.setAttribute("aria-hidden","true");
    }

    async function saveApiKey(){
      const key=el.apiKey.value.trim();
      if(!key){ alert(lang==="zh-CN"?"API Key 不能为空":"API Key is required"); return; }
      try{
        await SaveApiKey(key);
        setStatus(t("feed.created",{title:lang==="zh-CN"?"配置已保存":"Settings Saved"}),true);
        showToast(lang==="zh-CN"?"配置已保存":"Settings Saved");
        closeSettings();
      }catch(err){ setStatus(String(err),true); }
    }

    function blobToBase64(blob){
      return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onloadend=()=>resolve(String(reader.result).split(",")[1]);
        reader.onerror=()=>reject(new Error("audio read error"));
        reader.readAsDataURL(blob);
      });
    }
    const mimeToFormat = (m)=>m.includes("webm")?"webm":m.includes("ogg")?"opus":m.includes("wav")?"wav":m.includes("mp3")?"mp3":"webm";

    async function createFromVoice(text){
      setSync("working");
      setStatus(t("feed.parsing"),true);
      let parsed=[];
      try{
        const result=await ParseSchedule(text.trim());
        parsed=(Array.isArray(result)?result:[result]).map(x=>normalizeSchedule(x,text.trim())).filter(x=>x.title);
      }catch(err){
        setStatus(String(err),true);
      }
      if(!parsed.length) parsed=[normalizeSchedule({title:text.trim(),desc:text.trim()},text.trim())];
      parsed.reverse().forEach(it=>schedules.unshift(it));
      selectedDate=parseISO(parsed[0].date);
      parsed.forEach(it=>{
        setStatus(t("feed.created",{title:it.title}),true);
        showToast(t("toast.created",{title:it.title}));
      });
      renderTop(); renderCalendar(); renderEvents();
      setSync("synced");
    }

    async function recognize(blob,mime){
      setSync("working");
      setStatus(t("feed.recognized",{text:"..."}),true);
      try{
        const b64=await blobToBase64(blob);
        const text=await RecognizeSpeech(b64,mime,mimeToFormat(mime));
        setStatus(t("feed.recognized",{text}),true);
        await createFromVoice(text);
      }catch(err){
        setStatus(String(err),true);
        setSync("synced");
      }
    }

    function cleanupStream(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
    async function startRecording(){
      if(isRecording) return;
      pendingStop=false;
      if(!navigator.mediaDevices || typeof MediaRecorder==="undefined"){ setStatus("Recording unsupported",true); return; }
      try{
        stream=await navigator.mediaDevices.getUserMedia({audio:true});
        chunks=[]; recorder=new MediaRecorder(stream);
        recorder.addEventListener("dataavailable",(ev)=>{ if(ev.data.size>0) chunks.push(ev.data); });
        recorder.addEventListener("stop", async ()=>{
          const mime=recorder.mimeType||"audio/webm";
          const blob=new Blob(chunks,{type:mime});
          cleanupStream(); isRecording=false; pendingStop=false; recorder=null; el.voiceFab.classList.remove("listening");
          if(!blob.size){ setStatus("Empty audio",true); return; }
          await recognize(blob,mime);
        });
        recorder.start();
        isRecording=true;
        el.voiceFab.classList.add("listening");
        setStatus(t("feed.listening"),true);
        if(pendingStop) stopRecording();
      }catch(err){
        cleanupStream(); isRecording=false; recorder=null; el.voiceFab.classList.remove("listening"); setStatus(String(err),true);
      }
    }
    function stopRecording(){
      if(!isRecording || !recorder){ pendingStop=true; return; }
      if(recorder.state!=="inactive") recorder.stop();
    }

    function bindEvents(){
      el.btnToday.addEventListener("click",()=>{
        selectedDate=new Date(today);
        monthCursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
        renderTop(); renderCalendar(); renderEvents();
        showToast(t("toast.goToday"));
      });
      el.btnSearch.addEventListener("click",()=>setStatus(lang==="zh-CN"?"搜索功能开发中":"Search coming soon",true));
      el.btnSettings.addEventListener("click",openSettings);
      el.sheetClose.addEventListener("click",closeSettings);
      el.mask.addEventListener("click",closeSettings);
      el.btnSave.addEventListener("click",saveApiKey);
      el.btnProfile.addEventListener("click",()=>setStatus(lang==="zh-CN"?"个人中心开发中":"Profile coming soon",true));

      el.viewSeg.addEventListener("click",(ev)=>{
        const node=ev.target;
        if(!(node instanceof HTMLElement)) return;
        const view=node.dataset.view;
        if(!view) return;
        currentView=view;
        el.viewSeg.querySelectorAll(".seg-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
        renderTop();
      });

      el.monthPrev.addEventListener("click",()=>{ monthCursor.setMonth(monthCursor.getMonth()-1); renderCalendar(); });
      el.monthNext.addEventListener("click",()=>{ monthCursor.setMonth(monthCursor.getMonth()+1); renderCalendar(); });
      el.monthGrid.addEventListener("click",(ev)=>{
        const node=ev.target;
        if(!(node instanceof HTMLElement)) return;
        const dayBtn=node.closest(".day");
        if(!(dayBtn instanceof HTMLElement)) return;
        const key=dayBtn.dataset.date;
        if(!key) return;
        selectedDate=parseISO(key);
        monthCursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
        renderTop(); renderCalendar(); renderEvents();
      });
      el.monthGrid.addEventListener("wheel",(ev)=>{
        ev.preventDefault();
        monthCursor.setMonth(monthCursor.getMonth() + (ev.deltaY>0?1:-1));
        renderCalendar();
      },{passive:false});

      document.addEventListener("keydown",(ev)=>{
        if(ev.key==="ArrowLeft"){ selectedDate.setDate(selectedDate.getDate()-1); monthCursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1); renderTop(); renderCalendar(); renderEvents(); }
        if(ev.key==="ArrowRight"){ selectedDate.setDate(selectedDate.getDate()+1); monthCursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1); renderTop(); renderCalendar(); renderEvents(); }
      });

      el.voiceFab.addEventListener("click",()=>{ if(isRecording) stopRecording(); else startRecording(); });
      document.addEventListener("mouseup",()=>{ if(isRecording) stopRecording(); });

      el.langSeg.addEventListener("click",(ev)=>{
        const node=ev.target;
        if(!(node instanceof HTMLElement)) return;
        const next=node.dataset.lang;
        if(!next || !I18N[next]) return;
        lang=next;
        localStorage.setItem("voiceflow.locale",next);
        renderLocale();
      });
    }

    function renderLocale(){
      document.querySelectorAll("[data-i18n]").forEach(node=>{
        const key=node.getAttribute("data-i18n");
        const val=t(key);
        if(val && val!==key) node.textContent=val;
      });
      el.apiKey.placeholder=lang==="zh-CN"?"请输入 API Key":"Enter API Key";
      el.langSeg.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
      renderTop(); renderCalendar(); renderEvents();
      setSync(syncState);
      if(!el.statusBody.textContent) setStatus(lang==="zh-CN"?"等待语音输入":"Waiting for voice input",true);
    }

    async function bootstrap(){
      bindEvents();
      try{
        const key=await LoadApiKey();
        if(key) el.apiKey.value=key;
      }catch(err){ setStatus(String(err),true); }
      renderLocale();
      setSync("synced");
    }

    bootstrap();
  </script>
</body>
</html>
